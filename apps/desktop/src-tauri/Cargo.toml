[package]
name = "ignit-desktop"
version = "0.1.0"
description = "Ignit Desktop — Visor inmersivo de lectura PDF y biblioteca"
authors = ["Ignit"]
edition = "2021"

[lib]
name = "ignit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
