org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# API environment baked into the native apps at build time: `production` (default) or `local`.
# Production and local differ in BOTH the auth endpoint and the REST path, so the profile carries both,
# not just a base URL. Pass -Pignit.environment=local for a backend on the developer machine.
ignit.environment=production
