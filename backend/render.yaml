# Render blueprint — https://render.com/docs/blueprint-spec
# Repo on GitHub: Santidele22/ignit (existing GitHub account).
# Deploy on Render under ignit2026@gmail.com; fill `sync: false` secrets in Render.
services:
  - type: web
    name: ignit-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: node dist/main
    healthCheckPath: /session-mode
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_MODE
        value: prod
      - key: AUTH_MODE
        value: neon
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: BETTER_AUTH_CROSS_SITE
        value: 'true'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # PDFs and `reading.json` sidecars persist in Neon's built-in private
      # Object Storage bucket (`buckets.books` in backend/neon.ts), NOT external
      # Cloudflare R2 or AWS S3. AWS_* values come from `neon env pull` on the
      # production branch; BOOKS_DOWNLOAD_URL_TTL defaults to 120s.
      - key: BOOKS_STORAGE
        value: 's3'
      - key: BOOKS_S3_BUCKET
        value: 'books'
      - key: AWS_REGION
        value: 'us-east-2'
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
