<!doctype html>
<html lang="es" data-palette="noche-azul">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ignit · Dirección 03 — Estantes Apilados con Índice Lateral</title>
<style>
  :root {
    --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;

    /* Original (warm paper light theme — design/system.md) */
    --b-bg: #f4efe4;
    --b-panel: #fbf8f0;
    --b-panel-2: #ece5d4;
    --b-fg: #23201a;
    --b-body: #57503f;
    --b-faint: #6f6657;
    --b-ghost: #6f6657;
    --b-border: #ddd2bc;
    --b-border-strong: #6f6657;
    --b-accent: #c73e3a;
    --b-accent-deep: #a02f2b;
    --b-accent-bright: #a02f2b;
    --b-accent-fg: #fdf8ee;
    --b-surface-cover: #ece5d4;
    --b-bar-track: #e9e1cd;
    --b-bg-glass: rgba(244, 239, 228, 0.92);
    --b-accent-tint: rgba(199, 62, 58, 0.11);
    --b-grid-line: rgba(111, 102, 87, 0.11);
    --b-grid-glow: rgba(199, 62, 58, 0.07);
  }

  html[data-palette="noche-azul"] {
    color-scheme: dark;
    /* Noche azul + interior contrast lift (--b-* bridge — design/system.md) */
    --b-bg: #04050a;
    --b-panel: #0a101c;
    --b-panel-2: #10182e;
    --b-fg: #e6edf7;
    --b-body: #b9c6dd;
    --b-faint: #a9bcdf;
    --b-ghost: #93a6cc;
    --b-border: #4d5c86;
    --b-border-strong: #56658f;
    --b-accent: #5f86c9;
    --b-accent-deep: #43649e;
    --b-accent-bright: #9fc0ee;
    --b-accent-fg: #04050a;
    --b-surface-cover: #131a2e;
    --b-bar-track: #233054;
    --b-bg-glass: rgba(4, 5, 10, 0.9);
    --b-accent-tint: rgba(95, 134, 201, 0.15);
    --b-grid-line: rgba(77, 92, 134, 0.16);
    --b-grid-glow: rgba(95, 134, 201, 0.12);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--b-bg);
    color: var(--b-body);
    font-family: var(--font-sans);
    font-feature-settings: "palt" 1;
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
  }

  ::selection { background: var(--b-accent); color: var(--b-accent-fg); }
  :focus-visible { outline: 2px solid var(--b-accent-bright); outline-offset: 3px; }
  button, a, input { font-family: inherit; }
  button { cursor: pointer; }

  .skip-link {
    position: fixed; left: 16px; top: -80px; z-index: 100;
    background: var(--b-accent); color: var(--b-accent-fg);
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 10px 14px; text-decoration: none;
  }
  .skip-link:focus { top: 12px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 36% at 80% 4%, var(--b-grid-glow), transparent 70%),
      linear-gradient(90deg, var(--b-grid-line) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(0deg, var(--b-grid-line) 1px, transparent 1px) 0 0 / 40px 40px;
  }

  /* Topbar */
  header.app-top {
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid var(--b-border);
    background: var(--b-bg-glass);
    backdrop-filter: blur(12px);
  }
  .top-inner {
    max-width: 1400px; margin: 0 auto;
    padding: 12px clamp(16px, 3vw, 32px);
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--b-fg);
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
  }
  .hanko {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px;
    background: var(--b-accent); color: var(--b-accent-fg);
    font-family: var(--font-serif); font-size: 15px; font-weight: 700;
  }
  .search-top {
    flex: 1 1 280px; max-width: 440px;
    padding: 8px 12px; background: var(--b-panel); color: var(--b-fg);
    border: 1px solid var(--b-border-strong);
    font-family: var(--font-mono); font-size: 11px;
  }
  .search-top::placeholder { color: var(--b-ghost); }
  .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tema-toggle {
    display: inline-flex; border: 1px solid var(--b-border-strong); background: var(--b-panel);
  }
  .tema-toggle button {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em;
    text-transform: uppercase; padding: 7px 10px; background: none; border: 0; color: var(--b-faint);
  }
  .tema-toggle button + button { border-left: 1px solid var(--b-border); }
  .tema-toggle button[aria-pressed="true"] {
    background: var(--b-accent); color: var(--b-accent-fg); font-weight: 700;
  }
  .btn-primary {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 9px 14px; background: var(--b-accent);
    border: 1px solid var(--b-accent-bright); color: var(--b-accent-fg);
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover { background: var(--b-accent-bright); }

  /* Two-column Workspace: Collection Rail + Stacked Shelves */
  .workspace {
    position: relative; z-index: 2;
    max-width: 1400px; margin: 0 auto;
    padding: 24px clamp(16px, 3vw, 32px) 64px;
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }

  /* Left Collection Rail */
  aside.rail {
    position: sticky; top: 76px;
    border: 1px solid var(--b-border);
    background: var(--b-panel);
    padding: 16px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .rail-group-title {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--b-accent-bright);
    margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--b-border);
  }
  .rail-list { display: flex; flex-direction: column; gap: 3px; }
  .rail-btn {
    width: 100%; text-align: left;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 7px 9px; border: 1px solid transparent; background: none;
    color: var(--b-body); font-size: 12.5px;
    transition: background 0.14s, border-color 0.14s, color 0.14s;
  }
  .rail-btn:hover { background: var(--b-panel-2); color: var(--b-fg); }
  .rail-btn[aria-current="true"] {
    background: var(--b-accent-tint); border-color: var(--b-accent);
    color: var(--b-accent-bright); font-weight: 600;
  }
  .rail-count {
    font-family: var(--font-mono); font-size: 10px; color: var(--b-ghost);
  }
  .rail-btn[aria-current="true"] .rail-count { color: var(--b-accent-bright); }

  .rail-storage {
    padding-top: 14px; border-top: 1px solid var(--b-border);
  }
  .rail-storage-row {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--b-faint); margin-bottom: 6px;
  }
  .rail-storage-row b { color: var(--b-accent-bright); }
  .prog-bar {
    height: 5px; background: var(--b-bar-track); border: 1px solid var(--b-border); overflow: hidden;
  }
  .prog-bar i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--b-accent), var(--b-accent-bright));
  }
  .rail-storage-note {
    margin: 6px 0 0; font-family: var(--font-mono); font-size: 9px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--b-ghost);
  }

  /* Main Canvas */
  main.canvas { display: flex; flex-direction: column; gap: 28px; }

  /* Compact Resume Strip */
  .resume-strip {
    border: 1px solid var(--b-border-strong); background: var(--b-panel);
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
  }
  .resume-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .resume-mini-cover {
    width: 54px; height: 68px; flex: 0 0 auto;
    border: 1px solid var(--b-border-strong); background: var(--b-surface-cover);
  }
  .resume-kicker {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--b-accent-bright);
  }
  .resume-title {
    margin: 2px 0 0; font-family: var(--font-serif); font-size: 20px; font-weight: 400; color: var(--b-fg);
  }
  .resume-sub {
    font-family: var(--font-mono); font-size: 10px; color: var(--b-faint); margin-top: 2px;
  }

  /* Stacked Editorial Bands */
  .band-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding-bottom: 10px; margin-bottom: 16px;
    border-bottom: 1px solid var(--b-border-strong);
  }
  .band-kicker {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--b-accent-bright); margin: 0 0 2px;
  }
  .band-title {
    margin: 0; font-family: var(--font-serif); font-size: 24px; font-weight: 400; color: var(--b-fg);
  }
  .band-tech .band-title {
    font-family: var(--font-mono); font-size: 18px; font-weight: 700; letter-spacing: 0.02em;
  }
  .band-meta {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--b-faint);
  }

  /* Band I: Technical Compact 2-col Index Cards */
  .tech-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px;
  }
  .tech-item {
    border: 1px solid var(--b-border); background: var(--b-panel);
    padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    transition: border-color 0.15s;
  }
  .tech-item:hover { border-color: var(--b-accent-bright); }
  .tech-item-top {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--b-faint);
  }
  .tech-item-tag {
    padding: 2px 6px; border: 1px solid var(--b-accent); color: var(--b-accent-bright);
  }
  .tech-item h3 { margin: 4px 0 2px; font-size: 15px; font-weight: 600; color: var(--b-fg); }
  .tech-item .author { font-family: var(--font-mono); font-size: 10px; color: var(--b-faint); }
  .tech-item-foot {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding-top: 10px; border-top: 1px solid var(--b-border);
    font-family: var(--font-mono); font-size: 9.5px; color: var(--b-ghost);
  }

  /* Band II: Literature Cover Grid */
  .lit-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 16px;
  }
  .tomo {
    border: 1px solid var(--b-border); background: var(--b-panel);
    display: flex; flex-direction: column;
    transition: border-color 0.15s, transform 0.15s;
  }
  .tomo:hover { border-color: var(--b-accent-bright); transform: translateY(-2px); }
  .tomo-tapa {
    position: relative; aspect-ratio: 4 / 5; padding: 12px;
    background: var(--b-surface-cover);
    display: flex; flex-direction: column; justify-content: space-between;
    text-decoration: none; color: inherit; overflow: hidden;
    border-bottom: 1px solid var(--b-border);
  }
  .tomo-tapa svg {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.42; pointer-events: none;
  }
  .tomo-top, .tomo-copy { position: relative; z-index: 2; }
  .tomo-top {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .tomo-badge {
    padding: 2px 6px; border: 1px solid var(--b-border-strong);
    background: var(--b-panel); color: var(--b-accent-bright);
  }
  .tomo-titulo { font-family: var(--font-serif); font-size: 16.5px; line-height: 1.25; color: var(--b-fg); }
  .tomo-autor {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--b-faint); margin-top: 4px;
  }
  .tomo-foot {
    padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .tomo-cat { font-family: var(--font-mono); font-size: 9px; color: var(--b-faint); text-transform: uppercase; }
  .btn-dl {
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 5px 8px; border: 1px solid var(--b-border-strong);
    background: var(--b-bg); color: var(--b-fg);
  }
  .btn-dl[aria-pressed="true"] {
    border-color: var(--b-accent); color: var(--b-accent-bright); background: var(--b-accent-tint);
  }

  @media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; }
    aside.rail { position: static; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Saltar al contenido</a>
<div class="bg-grid" aria-hidden="true"></div>

<header class="app-top">
  <div class="top-inner">
    <a class="brand" href="#main-content">
      <span class="hanko" aria-hidden="true">熒</span>
      Ignit · Biblioteca
    </a>
    <input class="search-top" id="search" type="search" placeholder="Buscar por título, autor o tema…" aria-label="Buscar en la biblioteca" />
    <div class="top-actions">
      <div class="tema-toggle" role="group" aria-label="Paleta de colores">
        <button type="button" data-pal="noche-azul" aria-pressed="true">Noche azul</button>
        <button type="button" data-pal="original" aria-pressed="false">Original</button>
      </div>
      <button class="btn-primary" type="button">+ Subir libro</button>
    </div>
  </div>
</header>

<div class="workspace">
  <aside class="rail" aria-label="Índice de colecciones">
    <div>
      <h2 class="rail-group-title">Espacio</h2>
      <div class="rail-list">
        <button class="rail-btn" type="button" data-scope="library" aria-current="true"><span>Mi biblioteca</span><span class="rail-count">10</span></button>
        <button class="rail-btn" type="button" data-scope="device" aria-current="false"><span>En este dispositivo</span><span class="rail-count" id="r-dev">4</span></button>
        <button class="rail-btn" type="button" data-scope="catalog" aria-current="false"><span>Catálogo público</span><span class="rail-count">10</span></button>
        <button class="rail-btn" type="button" data-scope="submissions" aria-current="false"><span>Mis aportes</span><span class="rail-count">2</span></button>
      </div>
    </div>

    <div>
      <h2 class="rail-group-title">I · Estudio y Técnica</h2>
      <div class="rail-list">
        <button class="rail-btn" type="button" data-filter="wing:tech" aria-current="false"><span>Todos los técnicos</span><span class="rail-count">4</span></button>
        <button class="rail-btn" type="button" data-filter="kind:tecnico" aria-current="false"><span>Técnico</span><span class="rail-count">3</span></button>
        <button class="rail-btn" type="button" data-filter="kind:ciencia" aria-current="false"><span>Ciencia</span><span class="rail-count">1</span></button>
      </div>
    </div>

    <div>
      <h2 class="rail-group-title">II · Literatura y Humanidades</h2>
      <div class="rail-list">
        <button class="rail-btn" type="button" data-filter="wing:lit" aria-current="false"><span>Toda la literatura</span><span class="rail-count">6</span></button>
        <button class="rail-btn" type="button" data-filter="kind:ficcion" aria-current="false"><span>Ficción</span><span class="rail-count">1</span></button>
        <button class="rail-btn" type="button" data-filter="kind:terror_scifi" aria-current="false"><span>Terror y Sci-Fi</span><span class="rail-count">2</span></button>
        <button class="rail-btn" type="button" data-filter="kind:filosofia" aria-current="false"><span>Filosofía y Ensayo</span><span class="rail-count">1</span></button>
        <button class="rail-btn" type="button" data-filter="kind:historia" aria-current="false"><span>Historia</span><span class="rail-count">1</span></button>
        <button class="rail-btn" type="button" data-filter="kind:poesia" aria-current="false"><span>Poesía y Teatro</span><span class="rail-count">1</span></button>
      </div>
    </div>

    <div>
      <button class="rail-btn" type="button" data-filter="all" aria-current="true" style="border:1px solid var(--b-border-strong);">
        <span>Ver ambas colecciones</span><span class="rail-count">10</span>
      </button>
    </div>

    <div class="rail-storage">
      <div class="rail-storage-row"><span>PWA Offline</span><b id="meter-kb">2.1 MB</b></div>
      <div class="prog-bar"><i id="meter-bar" style="width:52%"></i></div>
      <p class="rail-storage-note" id="meter-note">4 libros · IndexedDB activo</p>
    </div>
  </aside>

  <main class="canvas" id="main-content">
    <div class="sr-only" aria-live="polite" id="live"></div>

    <section class="resume-strip" aria-label="Retomar lectura">
      <div class="resume-left">
        <div class="resume-mini-cover" aria-hidden="true">
          <svg viewBox="0 0 60 76" width="54" height="68" fill="none">
            <rect width="60" height="76" fill="var(--b-surface-cover)"/>
            <circle cx="30" cy="38" r="14" stroke="var(--b-accent-bright)" stroke-width="1.2"/>
            <path d="M10 14h40M10 62h40" stroke="var(--b-accent)" stroke-width="1"/>
          </svg>
        </div>
        <div>
          <div class="resume-kicker">RETOMAR EN VIGILIA · ESTUDIO TÉCNICO · 34%</div>
          <h1 class="resume-title">Crafting Interpreters</h1>
          <div class="resume-sub">Robert Nystrom · Pág 214 / 639 · Disponible offline</div>
        </div>
      </div>
      <a class="btn-primary" href="#main-content">Seguir leyendo →</a>
    </section>

    <div id="bands-mount"></div>
  </main>
</div>

<script>
const BOOKS = [
  { id: 1, wing: 'tech', kind: 'tecnico', label: 'Técnico', title: 'Crafting Interpreters', author: 'Robert Nystrom', pages: 639, kb: 680, pct: 34, offline: true },
  { id: 2, wing: 'tech', kind: 'tecnico', label: 'Técnico', title: 'Operating Systems: Three Easy Pieces', author: 'Remzi & Andrea Arpaci-Dusseau', pages: 712, kb: 820, pct: 18, offline: true },
  { id: 3, wing: 'tech', kind: 'tecnico', label: 'Técnico', title: 'Structure and Interpretation of Computer Programs', author: 'Abelson & Sussman', pages: 657, kb: 540, pct: 0, offline: false },
  { id: 4, wing: 'tech', kind: 'ciencia', label: 'Ciencia', title: 'Relatividad: la teoría especial y general', author: 'Albert Einstein', pages: 168, kb: 210, pct: 62, offline: false },
  { id: 5, wing: 'lit', kind: 'terror_scifi', label: 'Terror y Sci-Fi', title: 'Frankenstein o el moderno Prometeo', author: 'Mary Shelley', pages: 280, kb: 310, pct: 71, offline: true },
  { id: 6, wing: 'lit', kind: 'filosofia', label: 'Filosofía y Ensayo', title: 'Meditaciones', author: 'Marco Aurelio', pages: 194, kb: 180, pct: 45, offline: true },
  { id: 7, wing: 'lit', kind: 'ficcion', label: 'Ficción', title: 'La metamorfosis', author: 'Franz Kafka', pages: 112, kb: 120, pct: 100, offline: false },
  { id: 8, wing: 'lit', kind: 'terror_scifi', label: 'Terror y Sci-Fi', title: 'El extraño caso del Dr. Jekyll y Mr. Hyde', author: 'Robert Louis Stevenson', pages: 140, kb: 155, pct: 0, offline: false },
  { id: 9, wing: 'lit', kind: 'historia', label: 'Historia', title: 'El arte de la guerra', author: 'Sun Tzu', pages: 128, kb: 140, pct: 20, offline: false },
  { id: 10, wing: 'lit', kind: 'poesia', label: 'Poesía y Teatro', title: 'Las flores del mal', author: 'Charles Baudelaire', pages: 248, kb: 230, pct: 0, offline: false }
];

let scope = 'library';
let activeFilter = 'all';
let query = '';

function coverSvg(id) {
  const g = [
    '<circle cx="90" cy="112" r="44" stroke="var(--b-accent-bright)" stroke-width="1.2"/><path d="M22 38h136M22 186h136" stroke="var(--b-accent)" stroke-width="1"/>',
    '<rect x="34" y="42" width="112" height="140" stroke="var(--b-accent)" stroke-width="1.2"/><line x1="34" y1="112" x2="146" y2="112" stroke="var(--b-accent-bright)" stroke-width="1"/>',
    '<path d="M26 178 L90 42 L154 178 Z" stroke="var(--b-accent-bright)" stroke-width="1.2"/>'
  ];
  return `<svg viewBox="0 0 180 225" fill="none" aria-hidden="true">${g[id % g.length]}</svg>`;
}

function matchesFilter(b) {
  if (activeFilter === 'all') return true;
  if (activeFilter === 'wing:tech') return b.wing === 'tech';
  if (activeFilter === 'wing:lit') return b.wing === 'lit';
  if (activeFilter.startsWith('kind:')) return b.kind === activeFilter.slice(5);
  return true;
}

function render() {
  const q = query.trim().toLowerCase();
  const list = BOOKS
    .filter(b => scope === 'device' ? b.offline : true)
    .filter(matchesFilter)
    .filter(b => !q || (b.title + ' ' + b.author).toLowerCase().includes(q));

  const tech = list.filter(b => b.wing === 'tech');
  const lit = list.filter(b => b.wing === 'lit');

  let html = '';

  if (tech.length > 0) {
    html += `
      <section class="band band-tech" aria-labelledby="b-tech">
        <div class="band-head">
          <div>
            <p class="band-kicker">COLECCIÓN I · ESTUDIO Y REFERENCIA</p>
            <h2 class="band-title" id="b-tech">Libros Técnicos y Ciencia</h2>
          </div>
          <span class="band-meta">${tech.length} ${tech.length === 1 ? 'libro' : 'libros'} · ficha técnica</span>
        </div>
        <div class="tech-grid">
          ${tech.map((b, i) => `
            <article class="tech-item">
              <div>
                <div class="tech-item-top">
                  <span class="tech-item-tag">${b.label}</span>
                  <span>#${String(i + 1).padStart(2, '0')} · ${b.pages} p · ${b.kb} KB</span>
                </div>
                <h3>${b.title}</h3>
                <div class="author">${b.author}</div>
              </div>
              <div class="tech-item-foot">
                <span>${b.pct > 0 ? b.pct + '% leído' : 'Sin comenzar'}</span>
                <button class="btn-dl" type="button" data-dl="${b.id}" aria-pressed="${b.offline}">${b.offline ? 'offline ✓' : '↓ Descargar'}</button>
              </div>
            </article>
          `).join('')}
        </div>
      </section>
    `;
  }

  if (lit.length > 0) {
    html += `
      <section class="band band-lit" aria-labelledby="b-lit">
        <div class="band-head">
          <div>
            <p class="band-kicker">COLECCIÓN II · LECTURA DE VIGILIA</p>
            <h2 class="band-title" id="b-lit">Literatura y Humanidades</h2>
          </div>
          <span class="band-meta">${lit.length} ${lit.length === 1 ? 'libro' : 'libros'} · galería de tapas</span>
        </div>
        <div class="lit-grid">
          ${lit.map((b, i) => `
            <article class="tomo">
              <a class="tomo-tapa" href="#main-content">
                ${coverSvg(b.id)}
                <div class="tomo-top">
                  <span>${String(i + 1).padStart(2, '0')}</span>
                  <span class="tomo-badge">${b.offline ? 'offline ✓' : 'nube'}</span>
                </div>
                <div class="tomo-copy">
                  <div class="tomo-titulo">${b.title}</div>
                  <div class="tomo-autor">${b.author}</div>
                </div>
              </a>
              <div class="tomo-foot">
                <span class="tomo-cat">${b.label}${b.pct ? ' · ' + b.pct + '%' : ''}</span>
                <button class="btn-dl" type="button" data-dl="${b.id}" aria-pressed="${b.offline}">${b.offline ? 'Quitar' : '↓ Bajar'}</button>
              </div>
            </article>
          `).join('')}
        </div>
      </section>
    `;
  }

  if (!html) {
    html = '<p style="padding:28px;border:1px dashed var(--b-border);font-family:var(--font-mono);font-size:11px;color:var(--b-faint);">No hay libros que coincidan con el filtro seleccionado.</p>';
  }

  document.getElementById('bands-mount').innerHTML = html;

  const off = BOOKS.filter(b => b.offline);
  const totalKb = off.reduce((s, b) => s + b.kb, 0);
  document.getElementById('r-dev').textContent = off.length;
  document.getElementById('meter-kb').textContent = totalKb >= 1024 ? `${(totalKb / 1024).toFixed(1)} MB` : `${totalKb} KB`;
  document.getElementById('meter-bar').style.width = Math.min(100, Math.round((totalKb / 4200) * 100)) + '%';
  document.getElementById('meter-note').textContent = `${off.length} libros · IndexedDB activo`;
}

document.addEventListener('click', (e) => {
  const pal = e.target.closest('[data-pal]');
  if (pal) {
    document.documentElement.dataset.palette = pal.dataset.pal;
    document.querySelectorAll('[data-pal]').forEach(b => b.setAttribute('aria-pressed', String(b === pal)));
    return;
  }
  const sc = e.target.closest('[data-scope]');
  if (sc) {
    scope = sc.dataset.scope;
    document.querySelectorAll('[data-scope]').forEach(b => b.setAttribute('aria-current', String(b === sc)));
    render();
    return;
  }
  const fl = e.target.closest('[data-filter]');
  if (fl) {
    activeFilter = fl.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-current', String(b === fl)));
    render();
    return;
  }
  const dl = e.target.closest('[data-dl]');
  if (dl) {
    const b = BOOKS.find(x => x.id === Number(dl.dataset.dl));
    if (b) { b.offline = !b.offline; render(); }
  }
});

document.getElementById('search').addEventListener('input', (e) => { query = e.target.value; render(); });
render();
</script>
</body>
</html>
